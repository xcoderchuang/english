        function isJsonContent(arrayBuffer) {
            const headBytes = new Uint8Array(arrayBuffer, 0, Math.min(arrayBuffer.byteLength, 64));
            const head = new TextDecoder().decode(headBytes).trimStart();
            return head.startsWith('{');
        }

        function numOr(value, fallback) {
            return (typeof value === 'number' && isFinite(value) && value >= 0) ? value : fallback;
        }

        function normalizeSegment(s) {
            if (!s || typeof s !== 'object') return null;

            const words = (Array.isArray(s.words) ? s.words : []).map(w => {
                if (!w || typeof w !== 'object' || typeof w.word !== 'string' || !w.word.trim()) return null;
                const nw = {
                    word: w.word.trim(),
                    start: numOr(w.start, 0),
                    end: numOr(w.end, 0),
                    image: (w.image || '').trim()
                };
                if (typeof w.translation === 'string' && w.translation.trim()) nw.translation = w.translation.trim();
                if (w.marked === true) nw.marked = true;
                return nw;
            }).filter(Boolean);

            const start = numOr(s.start, words.length ? words[0].start : 0);
            let end = numOr(s.end, 0);
            if (end <= start) {
                end = (words.length && words[words.length - 1].end > start) ? words[words.length - 1].end : start + 0.001;
            }

            const ns = {
                start,
                end,
                text: typeof s.text === 'string' ? s.text : '',
                words
            };
            if (typeof s.repeat === 'number' && s.repeat > 0) ns.repeat = s.repeat;
            return ns;
        }

        function normalizeSongDoc(rawDoc) {
            const meta = {
                title: typeof rawDoc.meta?.title === 'string' ? rawDoc.meta.title : (currentSongFilename ? currentSongFilename.replace(/\.[^/.]+$/, "") : 'song'),
                version: typeof rawDoc.meta?.version === 'string' ? rawDoc.meta.version : '0.1'
            };
            if (typeof rawDoc.meta?.repeat === 'number' && rawDoc.meta.repeat > 0) meta.repeat = rawDoc.meta.repeat;
            if (typeof rawDoc.meta?.repeatGap === 'number' && isFinite(rawDoc.meta.repeatGap) && rawDoc.meta.repeatGap >= 0) meta.repeatGap = rawDoc.meta.repeatGap;

            const paragraphs = (Array.isArray(rawDoc.paragraphs) ? rawDoc.paragraphs : []).map(p => {
                const np = {};
                if (p && typeof p.repeat === 'number' && p.repeat > 0) np.repeat = p.repeat;
                const segments = (p && Array.isArray(p.segments) ? p.segments : [])
                    .map(normalizeSegment)
                    .filter(Boolean)
                    .sort((a, b) => a.start - b.start);
                np.segments = segments;
                return np;
            });

            return { meta, paragraphs };
        }

        function dataUrlToBytes(dataUrl) {
            const comma = dataUrl.indexOf(',');
            if (comma < 0) throw new Error("Invalid audio data URL.");
            const base64 = dataUrl.slice(comma + 1);
            let binary;
            try {
                binary = atob(base64);
            } catch (e) {
                throw new Error("Invalid base64 audio data.");
            }
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        //load mp3 from url
        async function getAudioBytes(audioField) {
            if (audioField.startsWith('data:')) {
                // base64：直接解码
                return dataUrlToBytes(audioField);
            } else {
                // URL：fetch 取二进制
                const resp = await fetch(audioField);
                if (!resp.ok) throw new Error(`Audio fetch failed: ${resp.status}`);
                return await resp.arrayBuffer();
            }
        }

        // v0.1 format: plain JSON with meta / paragraphs / audio (base64 data URL).
        async function parseJsonSongFile(arrayBuffer) {
            resetPlayerAndLyrics(false);
            loadStatus.textContent = 'Processing file...';

            try {
                const jsonString = new TextDecoder().decode(arrayBuffer);
                const rawDoc = JSON.parse(jsonString);
                if (!rawDoc || typeof rawDoc !== 'object' || !Array.isArray(rawDoc.paragraphs)) {
                    throw new Error("Invalid song JSON: missing 'paragraphs' array.");
                }
                //if (typeof rawDoc.audio !== 'string' || !rawDoc.audio.startsWith('data:')) {
                //    throw new Error("Invalid song JSON: missing 'audio' data URL.");
                //}

                songDoc = normalizeSongDoc(rawDoc);
                originalAudioDataUrl = await getAudioBytes(rawDoc.audio);;//rawDoc.audio;
                lyricsLoaded = songDoc.paragraphs.some(p => p.segments && p.segments.length > 0);
                if (songDoc.meta.title) document.title = `${songDoc.meta.title} · Live Lyrics`;
                renderLyrics();
                updateRepeatDisplays();
                updateParaNavState();

                //decodeAndPlayAudio(dataUrlToBytes(rawDoc.audio), 'File loaded successfully.');
                decodeAndPlayAudio(originalAudioDataUrl, 'File loaded successfully.');
            } catch (error) {
                alert(`Error processing file: ${error.message}`);
                console.error("File Parse/Setup Error:", error);
                resetPlayerAndLyrics(true);
                checkEnablePlayer();
                loadStatus.textContent = `Error: ${error.message}`;
            }
        }

        function togglePlayback() {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            if (!audioContext || !audioBuffer || isPlaying) return;


            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    playAudioInternal();
                }).catch(e => {
                    console.error("AudioContext resume failed:", e);
                    loadStatus.textContent = 'Error: Click page or button to enable audio.';
                });
                return;
            }

            playAudioInternal();
        }

        function playAudioInternal() {
            if (isPlaying || !audioContext || !audioBuffer) return;


            startOffset = Math.max(0, Math.min(startOffset, audioBuffer.duration));


            if (startOffset >= audioBuffer.duration) {
                startOffset = 0;
            }


            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.playbackRate.setValueAtTime(currentPlaybackRate, audioContext.currentTime);
            sourceNode.loop = true;
            sourceNode.connect(bassFilterNode);
            sourceNode.onended = handleAudioEnd;


            startTime = audioContext.currentTime;
            
            sourceNode.start(0, startOffset);

            isPlaying = true;
            isPaused = false;
            playPauseBtn.textContent = '❚❚ Pause';
            startUpdatingTime();
        }

        function pauseAudio() {
            if (!isPlaying || !sourceNode || !audioContext) return;


            const elapsedRealTime = audioContext.currentTime - startTime;
            const elapsedBufferTime = elapsedRealTime * currentPlaybackRate;


            startOffset = (startOffset + elapsedBufferTime) % audioBuffer.duration;
            startOffset = Math.max(0, startOffset);

            stopAudioInternals();

            isPlaying = false;
            isPaused = true;
            playPauseBtn.textContent = '▶ Play';


            updateCurrentTimeDisplay(startOffset);
        }


        function stopAudioInternals() {
             if (sourceNode) {
                sourceNode.onended = null;
                sourceNode.loop = false;
                try {
                    sourceNode.stop(0);
                } catch (e) {
                }
                sourceNode.disconnect();
                sourceNode = null;
            }
            stopUpdatingTime();
        }


        function stopAudio() {
            stopAudioInternals();
            isPlaying = false;
        }

        function seekAudio(bufferTime) {
            if (!audioBuffer || !audioContext) return;

            const wasPlaying = isPlaying;
            stopAudio();


            startOffset = Math.max(0, bufferTime);
            startOffset = Math.min(startOffset, audioBuffer.duration);


            progressBar.value = startOffset;
            updateCurrentTimeDisplay(startOffset);
            updateLyricsHighlight(startOffset, true, false);


            if (wasPlaying) {
                 playAudio();
            } else {
                isPaused = true;
                playPauseBtn.textContent = '▶ Play';
            }
        }


        function handleAudioEnd() {
             sourceNode = null;
        }



        function startUpdatingTime() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (!isPlaying || startTime <= 0 || !audioContext) {
                startTime = audioContext.currentTime;
            }

            function updateLoop() {
                if (!isPlaying || !audioBuffer || !sourceNode || !audioContext) {
                    animationFrameId = null; return;
                }

                const currentTime = getCurrentBufferTime();
                let loopSeeked = false;
                if (handleSentenceRepeat(currentTime)) {
                    // seekAudio restarts playback, which starts a fresh rAF loop;
                    // do not schedule a second one from here.
                    loopSeeked = true;
                } else if (!isHoldingRepeatGap(currentTime)) {
                    // Hold the current sentence's highlight while playback sits in
                    // the sentence repeat gap, so it does not flicker to the next.
                    updateLyricsHighlight(currentTime, false, true);
                }

                if (!isSeeking) {
                    updateCurrentTimeDisplay(currentTime);
                }


                if (!loopSeeked) {
                    animationFrameId = requestAnimationFrame(updateLoop);
                }
            }

            animationFrameId = requestAnimationFrame(updateLoop);
        }

        function stopUpdatingTime() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }



        function checkEnablePlayer() {
            const audioReady = isPlayerReady();
            playPauseBtn.disabled = !audioReady;
            progressBar.disabled = !audioReady;
            volumeBtn.disabled = !audioReady;
            volumeSlider.disabled = !audioReady;
            speedBtn.disabled = !audioReady;
            speedSlider.disabled = !audioReady;
            bassBoostBtn.disabled = !audioReady;
            bassBoostSlider.disabled = !audioReady;
            underwaterBtn.disabled = !audioReady;
            underwaterSlider.disabled = !audioReady;
            muffledBtn.disabled = !audioReady;
            muffledSlider.disabled = !audioReady;
            themeToggleBtn.disabled = !audioReady;
            downloadBtn.disabled = !audioReady;
            globalRepeatPlusBtn.disabled = !audioReady;
            globalRepeatMinusBtn.disabled = !audioReady || !songDoc?.meta?.repeat;


            if (!audioReady) {
                hidePopup(volumePopup);
                hidePopup(speedPopup);
                hidePopup(bassBoostPopup);
                hidePopup(underwaterPopup);
                hidePopup(muffledPopup);
            }


            if (audioContext) {
                const currentVolume = gainNode ? gainNode.gain.value : parseFloat(volumeSlider.value);
                updateVolumeIcon(currentVolume);
                if (volumePercentage) volumePercentage.textContent = `${Math.round(currentVolume * 100)}%`;
                if (speedRateDisplay) speedRateDisplay.textContent = `${currentPlaybackRate.toFixed(2)}x`;
                if (bassFilterNode && bassBoostLevelDisplay) {
                     const currentBoost = bassFilterNode.gain.value;
                     bassBoostLevelDisplay.textContent = `${currentBoost > 0 ? '+' : ''}${Math.round(currentBoost)} dB`;
                }
                if (underwaterFilterNode && underwaterLevelDisplay) {
                    const currentLevel = parseFloat(underwaterSlider.value);
                    underwaterLevelDisplay.textContent = `${Math.round(currentLevel)}%`;
                }
                if (muffledFilterNode && muffledLevelDisplay) {
                    const currentLevel = parseFloat(muffledSlider.value);
                    muffledLevelDisplay.textContent = `${Math.round(currentLevel)}%`;
                }
            }
            if (audioReady) {
                updateTotalDurationDisplay();
                updateCurrentTimeDisplay(startOffset);
            } else {
                 totalDurationDisplay.textContent = '0:00';
                 currentTimeDisplay.textContent = '0:00';
                 progressBar.value = 0;
                 progressBar.max = 1;
            }
            updateParaNavState();
            updateRepeatDisplays();
        }

        function resetPlayerAndLyrics(resetSettings = false) {
            stopAudio();

            audioLoaded = false; lyricsLoaded = false; audioBuffer = null;
            songDoc = null;
            flatSegments = []; flatWords = []; wordSpans = []; wordTransSpans = []; wordImgs = []; segSpans = []; paraSpans = [];
            currentSegFlatIndex = -1; currentWordFlatIndex = -1; repeatPlaysLeft = 1;
            originalAudioDataUrl = null; originalAudioBytes = null; originalAudioMime = null;
            closeEditorDialog();
            startOffset = 0; startTime = 0; isPaused = false; isPlaying = false;

            if (resetSettings) {
                currentSongFilename = null;
            }
            document.title = 'Live Lyrics';

            lyricsOutput.innerHTML = 'Load a lyrics.json or .mp3 file.';
            lyricsOutput.className = 'placeholder';
            lyricsContainer.style.justifyContent = 'center';
            lyricsContainer.style.alignItems = 'center';
            lyricsContainer.scrollTop = 0;

            playPauseBtn.textContent = '▶ Play';
            progressBar.value = 0; progressBar.max = 1;
            currentTimeDisplay.textContent = '0:00';
            totalDurationDisplay.textContent = '0:00';

            if (resetSettings) {
                const defaultVolume = 1;
                const defaultSpeed = 1.0;
                const defaultBassBoost = 0;
                const defaultUnderwater = 0;
                const defaultMuffled = 0;
                isMuted = false; 
                previousVolumeBeforeMute = defaultVolume;
                if (audioContext) {
                    setVolume(defaultVolume); 
                    setPlaybackSpeed(defaultSpeed, false);
                    setBassBoost(defaultBassBoost);
                    setUnderwaterEffect(defaultUnderwater);
                    setMuffledEffect(defaultMuffled);
                }
                updateTotalDurationDisplay();
            } else {
                if (audioContext) {
                    loadVolumeSetting(); 
                    loadSpeedSetting();
                    loadBassBoostSetting();
                    loadUnderwaterSetting();
                    loadMuffledSetting();
                }
                updateTotalDurationDisplay();
            }

            hidePopup(volumePopup);
            hidePopup(speedPopup);
            hidePopup(bassBoostPopup);
            hidePopup(underwaterPopup);
            hidePopup(muffledPopup);
            checkEnablePlayer();
        }


        // ===== lyrics model / rendering / editing (test extraction start) =====

        // Pointer gesture parameters: a short press jumps playback to the word,
        // a 600ms long press opens the editor dialog, moving more than 10px
        // cancels the gesture (e.g. touch scrolling).
        const LONG_PRESS_MS = 600;
        const MOVE_CANCEL_PX = 10;

        // Sentence repeat gap: pause between two plays of a repeated sentence.
        // Configurable via meta.repeatGap; applies to sentence-level repeat only.
        const DEFAULT_REPEAT_GAP = 0.3;

        // Word whose long-press / right-click opened the editor dialog.
        let dialogWordFlatIndex = -1;
        // Active pointer gesture on a word (see the pointer event handlers).
        let wordGesture = null;

        function classifyPointerGesture(moved, heldMs, longPressFired) {
            if (moved) return 'move';
            if (longPressFired || heldMs >= LONG_PRESS_MS) return 'longpress';
            return 'tap';
        }

        function getRepeatGap() {
            const gap = songDoc?.meta?.repeatGap;
            return (typeof gap === 'number' && isFinite(gap) && gap >= 0) ? gap : DEFAULT_REPEAT_GAP;
        }

        // The gap only applies when the sentence has its own repeat setting
        // (sentence-level repeat); paragraph/global repeats replay back-to-back.
        function hasOwnSentenceRepeat(segFlatIdx) {
            const fs = flatSegments[segFlatIdx];
            return !!(fs && fs.seg && typeof fs.seg.repeat === 'number' && fs.seg.repeat > 0);
        }

        function repeatGapFor(segFlatIdx) {
            if (!hasOwnSentenceRepeat(segFlatIdx)) return 0;
            const fs = flatSegments[segFlatIdx];
            const end = Math.min(fs.seg.end, audioBuffer?.duration ?? fs.seg.end);
            return Math.min(getRepeatGap(), Math.max(0, (audioBuffer?.duration ?? end) - end));
        }

        function renderLyrics() {
            // Rebuilding the DOM collapses the container's scroll position, so
            // remember it here and restore it after the re-render; otherwise a
            // split/merge edit would jump the view back to the top of the song.
            const savedScrollTop = lyricsContainer.scrollTop;
            lyricsOutput.innerHTML = '';
            flatSegments = [];
            flatWords = [];
            wordSpans = [];
            wordTransSpans = [];
            wordImgs = [];
            segSpans = [];
            paraSpans = [];
            currentSegFlatIndex = -1;
            currentWordFlatIndex = -1;
            repeatPlaysLeft = 1;

            const hasContent = !!songDoc && songDoc.paragraphs.some(p => p.segments && p.segments.length > 0);

            if (!hasContent) {
                lyricsOutput.innerHTML = 'No lyrics content in file.';
                lyricsOutput.className = 'placeholder';
                lyricsContainer.style.justifyContent = 'center';
                lyricsContainer.style.alignItems = 'center';
                updateRepeatDisplays();
                updateParaNavState();
                return;
            }

            lyricsOutput.className = '';
            lyricsContainer.style.justifyContent = 'flex-start';
            lyricsContainer.style.alignItems = 'flex-start';

            songDoc.paragraphs.forEach((para, pi) => {
                const paraDiv = document.createElement('div');
                paraDiv.className = 'paragraph';

                const header = document.createElement('div');
                header.className = 'paragraph-header';
                header.dataset.p = pi;
                const label = document.createElement('span');
                label.className = 'para-label';
                label.textContent = `¶ ${pi + 1}`;
                header.appendChild(label);
                paraDiv.appendChild(header);

                para.segments.forEach((seg, si) => {
                    const segSpan = document.createElement('span');
                    segSpan.className = 'segment';
                    const segFlat = flatSegments.length;
                    flatSegments.push({ paraIdx: pi, segIdx: si, seg, firstWordFlatIndex: flatWords.length });

                    (seg.words || []).forEach((w, wi) => {
                        const wspan = document.createElement('span');
                        wspan.className = 'word';
                        wspan.textContent = w.word;
                        wspan.dataset.w = flatWords.length;
                        if (w.marked) wspan.classList.add('marked');
                        segSpan.appendChild(wspan);
                        wordSpans.push(wspan);
                        flatWords.push({ paraIdx: pi, segIdx: si, wordIdx: wi, word: w, segFlat });
                        if (w.marked && w.translation) {
                            const transSpan = document.createElement('span');
                            transSpan.className = 'word-trans';
                            transSpan.textContent = `(${w.translation})`;
                            segSpan.appendChild(transSpan);
                            wordTransSpans.push(transSpan);
                        } else {
                            wordTransSpans.push(null);
                        }
                        if (w.image)
                        {
                            const img = document.createElement('img');
                            img.className = 'word-img';
                            img.src = w.image;
                            segSpan.appendChild(img);
                            wordImgs.push(img);
                        } else {
                            wordImgs.push(null);
                        }
                    });

                    paraDiv.appendChild(segSpan);
                    segSpans.push(segSpan);
                });

                lyricsOutput.appendChild(paraDiv);
                paraSpans.push(header);
            });

            lyricsContainer.style.scrollBehavior = 'auto';
            lyricsContainer.scrollTop = savedScrollTop;
            requestAnimationFrame(() => {
                lyricsContainer.style.scrollBehavior = 'smooth';
            });

            updateRepeatDisplays();
            updateParaNavState();
        }

        // Priority: sentence > paragraph > global. Unset (or 0, which removes the field)
        // falls back to the level above; with nothing set anywhere the sentence plays once.
        function getEffectiveRepeat(segFlatIdx) {
            if (!flatSegments[segFlatIdx]) return 1;
            const fs = flatSegments[segFlatIdx];
            return fs.seg.repeat ?? songDoc.paragraphs[fs.paraIdx].repeat ?? songDoc.meta.repeat ?? 1;
        }

        // Only the global repeat lives in the top toolbar now; sentence and
        // paragraph repeat controls moved into the editor dialog.
        function updateRepeatDisplays() {
            if (!songDoc) {
                globalRepeatValue.textContent = '1';
                globalRepeatMinusBtn.disabled = true;
                return;
            }
            globalRepeatValue.textContent = songDoc.meta.repeat ?? 1;
            globalRepeatMinusBtn.disabled = !isPlayerReady() || !songDoc.meta.repeat;
        }

        function setRepeat(level, idx, delta) {
            if (!songDoc) return;
            if (delta > 0) {
                if (level === 'seg') {
                    const seg = flatSegments[idx].seg;
                    seg.repeat = (seg.repeat ?? getEffectiveRepeat(idx)) + 1;
                } else if (level === 'para') {
                    const para = songDoc.paragraphs[idx];
                    para.repeat = (para.repeat ?? songDoc.meta.repeat ?? 1) + 1;
                } else if (level === 'global') {
                    songDoc.meta.repeat = (songDoc.meta.repeat ?? 1) + 1;
                }
            } else {
                if (level === 'seg') {
                    const seg = flatSegments[idx].seg;
                    if (seg.repeat) {
                        seg.repeat -= 1;
                        if (seg.repeat <= 0) delete seg.repeat;
                    }
                } else if (level === 'para') {
                    const para = songDoc.paragraphs[idx];
                    if (para.repeat) {
                        para.repeat -= 1;
                        if (para.repeat <= 0) delete para.repeat;
                    }
                } else if (level === 'global') {
                    if (songDoc.meta.repeat) {
                        songDoc.meta.repeat -= 1;
                        if (songDoc.meta.repeat <= 0) delete songDoc.meta.repeat;
                    }
                }
            }
            if (currentSegFlatIndex >= 0) repeatPlaysLeft = getEffectiveRepeat(currentSegFlatIndex);
            updateRepeatDisplays();
        }

        // Called every animation frame while playing. Loops back to the sentence start
        // until the remaining play count for the current sentence is exhausted. A
        // sentence-level repeat waits repeatGap (default 0.3s) after the sentence ends
        // before replaying; paragraph/global repeats replay back-to-back.
        function handleSentenceRepeat(currentTime) {
            if (!lyricsLoaded || currentSegFlatIndex < 0) return false;
            const fs = flatSegments[currentSegFlatIndex];
            const end = Math.min(fs.seg.end, audioBuffer?.duration ?? fs.seg.end);
            if (currentTime < end) return false;
            if (repeatPlaysLeft <= 1) return false;
            const gap = repeatGapFor(currentSegFlatIndex);
            if (currentTime < end + gap) return false;
            const remaining = repeatPlaysLeft - 1;
            repeatPlaysLeft = remaining;
            seekAudio(Math.max(0, fs.seg.start));
            repeatPlaysLeft = remaining; // seekAudio re-syncs the counter; keep the decremented value
            updateRepeatDisplays();
            return true;
        }

        // True while playback sits in the repeat gap after the sentence ended:
        // keep highlighting the current sentence instead of advancing to the next.
        function isHoldingRepeatGap(currentTime) {
            if (!lyricsLoaded || currentSegFlatIndex < 0) return false;
            if (repeatPlaysLeft <= 1) return false;
            const gap = repeatGapFor(currentSegFlatIndex);
            if (gap <= 0) return false;
            const fs = flatSegments[currentSegFlatIndex];
            const end = Math.min(fs.seg.end, audioBuffer?.duration ?? fs.seg.end);
            return currentTime >= end && currentTime < end + gap;
        }

        function findSegmentIndexAt(t) {
            let lo = 0, hi = flatSegments.length - 1, result = -1;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (flatSegments[mid].seg.start <= t) { result = mid; lo = mid + 1; }
                else hi = mid - 1;
            }
            return result < 0 ? 0 : result;
        }

        function findWordIndexAt(t, segFlatIdx) {
            const fs = flatSegments[segFlatIdx];
            if (!fs || fs.seg.words.length === 0) return -1;
            const lookahead = t + 0.05;
            let result = 0;
            for (let i = 0; i < fs.seg.words.length; i++) {
                if (fs.seg.words[i].start <= lookahead) result = i;
                else break;
            }
            return fs.firstWordFlatIndex + result;
        }

        function updateLyricsHighlight(currentBufferTime, forceUpdate = false, allowScroll = false) {
            const effectiveTime = audioBuffer ? (currentBufferTime % audioBuffer.duration) : 0;

            if (!lyricsLoaded || flatSegments.length === 0) {
                if (currentSegFlatIndex !== -1 || currentWordFlatIndex !== -1) {
                    clearSegmentHighlight();
                    clearWordHighlight();
                    currentSegFlatIndex = -1;
                    currentWordFlatIndex = -1;
                    updateParaNavState();
                }
                return;
            }

            const newSegIndex = findSegmentIndexAt(effectiveTime);
            const segChanged = newSegIndex !== currentSegFlatIndex;
            let newWordIndex = -1;
            if (flatSegments[newSegIndex].seg.words.length > 0) {
                newWordIndex = findWordIndexAt(effectiveTime, newSegIndex);
            }
            const wordChanged = newWordIndex !== currentWordFlatIndex;

            if (segChanged || wordChanged || forceUpdate) {
                if (segChanged || forceUpdate) {
                    applySegmentHighlight(newSegIndex);
                    currentSegFlatIndex = newSegIndex;
                    repeatPlaysLeft = getEffectiveRepeat(newSegIndex);
                    if (allowScroll && !isSeeking && isPlaying) scrollSegmentIntoView(newSegIndex);
                    updateRepeatDisplays();
                    updateParaNavState();
                }
                if (wordChanged || forceUpdate || segChanged) {
                    applyWordHighlight(newWordIndex);
                    currentWordFlatIndex = newWordIndex;
                }
            }
        }

        function applySegmentHighlight(segFlatIdx) {
            const curPara = flatSegments[segFlatIdx].paraIdx;
            segSpans.forEach((span, i) => {
                span.classList.toggle('active', i === segFlatIdx);
                span.classList.toggle('past', i < segFlatIdx);
            });
            paraSpans.forEach((header, i) => {
                header.classList.toggle('active', i === curPara);
            });
        }

        function clearSegmentHighlight() {
            segSpans.forEach(span => span.classList.remove('active', 'past'));
            paraSpans.forEach(header => header.classList.remove('active'));
        }

        function applyWordHighlight(wordFlatIdx) {
            wordSpans.forEach((span, i) => span.classList.toggle('highlighted', i === wordFlatIdx));
        }

        function clearWordHighlight() {
            wordSpans.forEach(span => span.classList.remove('highlighted'));
        }

        function scrollSegmentIntoView(segFlatIdx) {
            const segSpan = segSpans[segFlatIdx];
            if (!segSpan) return;
            const containerRect = lyricsContainer.getBoundingClientRect();
            const segRect = segSpan.getBoundingClientRect();
            const zoneTop = containerRect.top + containerRect.height * 0.25;
            const zoneBottom = containerRect.top + containerRect.height * 0.75;
            if (segRect.top < zoneTop || segRect.bottom > zoneBottom) {
                segSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateParaNavState() {
            const ready = isPlayerReady() && flatSegments.length > 0;
            let curPara = -1;
            if (ready && currentSegFlatIndex >= 0) curPara = flatSegments[currentSegFlatIndex].paraIdx;
            const paraCount = songDoc ? songDoc.paragraphs.length : 0;
            prevParaBtn.disabled = !ready || curPara <= 0;
            nextParaBtn.disabled = !ready || curPara < 0 || curPara >= paraCount - 1;
        }

        function seekToParagraph(pi) {
            if (!isPlayerReady() || !songDoc || !songDoc.paragraphs[pi]) return;
            const seg = songDoc.paragraphs[pi].segments?.[0];
            if (!seg) return;
            seekAudio(seg.start);
        }

        // Split the paragraph after the given sentence: sentences after it move to a
        // new paragraph inserted right below. The new paragraph keeps the parent's
        // repeat setting so playback behavior is unchanged. keepWord (when the edit
        // came from the editor dialog) is the pressed word object; the dialog is
        // retargeted to it after the re-render.
        function splitParagraphAt(segFlatIdx, keepWord = null) {
            if (!songDoc || segFlatIdx < 0) return;
            const fs = flatSegments[segFlatIdx];
            const para = songDoc.paragraphs[fs.paraIdx];
            if (!para || fs.segIdx >= para.segments.length - 1) return;

            const newPara = { segments: para.segments.splice(fs.segIdx + 1) };
            if (para.repeat) newPara.repeat = para.repeat;
            songDoc.paragraphs.splice(fs.paraIdx + 1, 0, newPara);
            reSyncAfterStructuralEdit(keepWord);
        }

        // Merge the paragraph with the next one. If only the next paragraph had a
        // repeat setting, keep it on the merged paragraph.
        function mergeParagraphWithNext(pi, keepWord = null) {
            if (!songDoc || pi < 0 || pi >= songDoc.paragraphs.length - 1) return;

            const first = songDoc.paragraphs[pi];
            const second = songDoc.paragraphs[pi + 1];
            if (!first.repeat && second.repeat) first.repeat = second.repeat;
            first.segments.push(...second.segments);
            songDoc.paragraphs.splice(pi + 1, 1);
            reSyncAfterStructuralEdit(keepWord);
        }

        // Split the sentence at the current word: the words before it stay in this
        // sentence, the word and everything after it become a new sentence right
        // after. The new sentence keeps the parent's repeat setting.
        function splitSentenceAt(wordFlatIdx) {
            if (!songDoc || wordFlatIdx < 0) return;
            const fw = flatWords[wordFlatIdx];
            if (!fw || fw.wordIdx <= 0) return;
            const fs = flatSegments[fw.segFlat];
            const para = songDoc.paragraphs[fs.paraIdx];
            const seg = para.segments[fs.segIdx];
            if (!seg || seg.words.length <= 1) return;

            const targetWord = fw.word;
            const leftWords = seg.words.slice(0, fw.wordIdx);
            const rightWords = seg.words.slice(fw.wordIdx);
            const origEnd = seg.end;
            seg.words = leftWords;
            seg.end = Math.max(seg.start, leftWords[leftWords.length - 1].end);
            seg.text = leftWords.map(w => w.word).join(' ');
            const newSeg = {
                start: rightWords[0].start,
                end: origEnd,
                text: rightWords.map(w => w.word).join(' '),
                words: rightWords
            };
            if (seg.repeat) newSeg.repeat = seg.repeat;
            para.segments.splice(fs.segIdx + 1, 0, newSeg);
            reSyncAfterStructuralEdit(targetWord);
        }

        // Merge the sentence with the next one. If only the next sentence had a
        // repeat setting, keep it on the merged sentence.
        function mergeSentenceWithNext(wordFlatIdx) {
            if (!songDoc || wordFlatIdx < 0) return;
            const fw = flatWords[wordFlatIdx];
            if (!fw) return;
            const fs = flatSegments[fw.segFlat];
            const para = songDoc.paragraphs[fs.paraIdx];
            if (!para || fs.segIdx >= para.segments.length - 1) return;

            const targetWord = fw.word;
            const first = para.segments[fs.segIdx];
            const second = para.segments[fs.segIdx + 1];
            if (!first.repeat && second.repeat) first.repeat = second.repeat;
            first.words.push(...second.words);
            first.end = Math.max(first.end, second.end);
            first.text = first.words.map(w => w.word).join(' ');
            para.segments.splice(fs.segIdx + 1, 1);
            reSyncAfterStructuralEdit(targetWord);
        }

        function reSyncAfterStructuralEdit(keepWord = null) {
            renderLyrics();
            updateLyricsHighlight(audioBuffer ? getCurrentBufferTime() : 0, true, false);
            if (keepWord && editorOverlay.classList.contains('show')) {
                const newIdx = flatWords.findIndex(f => f.word === keepWord);
                if (newIdx >= 0) {
                    dialogWordFlatIndex = newIdx;
                    loadWordFields(keepWord);
                    updateEditorRepeatControls();
                } else {
                    closeEditorDialog();
                }
            }
        }

        // Short press on a word: jump playback to the word's start time and play.
        function jumpToWord(wordFlatIdx) {
            const fw = flatWords[wordFlatIdx];
            if (!fw || !isPlayerReady()) return;
            const t = fw.word.start;
            if (typeof t !== 'number' || !isFinite(t)) return;
            seekAudio(Math.max(0, t));
            if (!isPlaying) playAudio();
        }

        // Long press / right-click: open the editor dialog (three stacked zones:
        // word, sentence, paragraph). Audio pauses and the current word / sentence /
        // paragraph attributes are loaded into the controls.
        function openEditorDialog(wordFlatIdx) {
            const fw = flatWords[wordFlatIdx];
            if (!fw) return;
            dialogWordFlatIndex = wordFlatIdx;
            if (isPlaying) pauseAudio();
            loadWordFields(fw.word);
            updateEditorRepeatControls();
            editorOverlay.classList.add('show');
        }

        function closeEditorDialog() {
            editorOverlay.classList.remove('show');
            dialogWordFlatIndex = -1;
        }

        function loadWordFields(word) {
            editWordInput.value = word.word ?? '';
            editTranslationInput.value = word.translation ?? '';
            editMarkedCheckbox.checked = !!word.marked;
            editImageInput.value = word.image ?? '';
        }

        // Word-zone edits apply immediately (memory only; the file is written on export).
        function applyWordFieldsFromDialog() {
            if (dialogWordFlatIndex < 0) return;
            const fw = flatWords[dialogWordFlatIndex];
            if (!fw) return;

            const newText = editWordInput.value.trim();
            if (newText) fw.word.word = newText;

            const translation = editTranslationInput.value.trim();
            if (translation) fw.word.translation = translation; else delete fw.word.translation;

            if (editMarkedCheckbox.checked) fw.word.marked = true; else delete fw.word.marked;

            fw.word.image = editImageInput.value.trim();

            const span = wordSpans[dialogWordFlatIndex];
            if (span) {
                span.textContent = fw.word.word;
                span.classList.toggle('marked', !!fw.word.marked);
            }
            updateWordTranslationSpan(dialogWordFlatIndex, fw.word);
            updateWordImage(dialogWordFlatIndex, fw.word);
        }

        // The sentence / paragraph the dialog currently targets.
        function dialogTargets() {
            if (!songDoc || dialogWordFlatIndex < 0) return null;
            const fw = flatWords[dialogWordFlatIndex];
            if (!fw || !flatSegments[fw.segFlat]) return null;
            return { fw, fs: flatSegments[fw.segFlat], para: songDoc.paragraphs[fw.paraIdx] };
        }

        function updateEditorRepeatControls() {
            const t = dialogTargets();
            if (!t) return;

            edSegRepeatVal.textContent = String(getEffectiveRepeat(t.fw.segFlat));
            edSegRepeatMinusBtn.disabled = !t.fs.seg.repeat;
            edParaRepeatVal.textContent = String(t.para.repeat ?? songDoc.meta.repeat ?? 1);
            edParaRepeatMinusBtn.disabled = !t.para.repeat;

            // Split sentence needs a word boundary inside the sentence; split/merge
            // sentence and paragraph need a neighbor to split from / merge with.
            edSegSplitBtn.disabled = t.fw.wordIdx <= 0;
            edSegMergeBtn.disabled = t.fs.segIdx >= t.para.segments.length - 1;
            edParaSplitBtn.disabled = t.fs.segIdx >= t.para.segments.length - 1;
            edParaMergeBtn.disabled = t.fs.paraIdx >= songDoc.paragraphs.length - 1;
        }

        // The translation is shown inline only for marked words; un-marking hides it.
        function updateWordTranslationSpan(wordFlatIdx, word) {
            const existing = wordTransSpans[wordFlatIdx];
            const show = !!word.marked && !!word.translation;
            if (show) {
                if (existing) {
                    existing.textContent = `(${word.translation})`;
                } else {
                    const transSpan = document.createElement('span');
                    transSpan.className = 'word-trans';
                    transSpan.textContent = `(${word.translation})`;
                    const wordSpan = wordSpans[wordFlatIdx];
                    wordSpan.parentNode.insertBefore(transSpan, wordSpan.nextSibling);
                    wordTransSpans[wordFlatIdx] = transSpan;
                }
            } else if (existing) {
                existing.remove();
                wordTransSpans[wordFlatIdx] = null;
            }
        }

        //Reder image
        function updateWordImage(wordFlatIdx, word) {
            const existing = wordImgs[wordFlatIdx];
            const show = !!word.image;
            if (show) {
                if (existing) {
                    existing.src = word.image;
                } else {
                    const img = document.createElement('img');
                    img.className = 'word-image';
                    img.src = word.image;
                    const wordSpan = wordSpans[wordFlatIdx];
                    wordSpan.parentNode.insertBefore(img, wordSpan.nextSibling);
                    wordImgs[wordFlatIdx] = img;
                }
            } else if (existing) {
                existing.remove();
                wordImgs[wordFlatIdx] = null;
            }
        }


        function updateVolumeIcon(volume) {
            if (!volumeIcon) return;
            volumeIcon.className = 'fas ';
            if (volume <= 0) {
                volumeIcon.classList.add('fa-volume-mute');
            } else if (volume < 0.5) {
                volumeIcon.classList.add('fa-volume-down');
            } else {
                volumeIcon.classList.add('fa-volume-up');
            }
        }


        function resetPopupTimer(popupElement) {
            clearPopupTimer(popupElement);


            const timerCallback = () => {
                hidePopup(popupElement);
            };


            if (popupElement === volumePopup) {
                volumePopupTimeout = setTimeout(timerCallback, POPUP_CLOSE_DELAY);
            } else if (popupElement === speedPopup) {
                speedPopupTimeout = setTimeout(timerCallback, POPUP_CLOSE_DELAY);
            } else if (popupElement === bassBoostPopup) {
                bassBoostPopupTimeout = setTimeout(timerCallback, POPUP_CLOSE_DELAY);
            } else if (popupElement === underwaterPopup) {
                underwaterPopupTimeout = setTimeout(timerCallback, POPUP_CLOSE_DELAY);
            } else if (popupElement === muffledPopup) {
                muffledPopupTimeout = setTimeout(timerCallback, POPUP_CLOSE_DELAY);
            }
        }


        function clearPopupTimer(popupElement) {
             if (popupElement === volumePopup && volumePopupTimeout) {
                clearTimeout(volumePopupTimeout);
                volumePopupTimeout = null;
            } else if (popupElement === speedPopup && speedPopupTimeout) {
                clearTimeout(speedPopupTimeout);
                speedPopupTimeout = null;
            } else if (popupElement === bassBoostPopup && bassBoostPopupTimeout) {
                clearTimeout(bassBoostPopupTimeout);
                bassBoostPopupTimeout = null;
            } else if (popupElement === underwaterPopup && underwaterPopupTimeout) {
                clearTimeout(underwaterPopupTimeout);
                underwaterPopupTimeout = null;
            } else if (popupElement === muffledPopup && muffledPopupTimeout) {
                clearTimeout(muffledPopupTimeout);
                muffledPopupTimeout = null;
            }
        }


        function togglePopup(el) {
            el.classList.toggle('show');
        }


        function hidePopup(el) {
            el.classList.remove('show');
            clearPopupTimer(el);
        }


        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return '0:00';
            const totalSeconds = Math.floor(seconds);
            const minutes = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }



        lyricsOutput.addEventListener('click', (event) => {
            const header = event.target.closest('.paragraph-header');
            if (header) {
                seekToParagraph(parseInt(header.dataset.p, 10));
                return;
            }
        });

        // Pointer events unify mouse / touch / stylus on words: a short press jumps
        // playback to the word, a 600ms long press opens the editor dialog, moving
        // more than 10px cancels the gesture (e.g. touch scrolling).
        lyricsOutput.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            const wordSpan = event.target.closest('.word');
            if (!wordSpan) return;
            const wordFlatIdx = parseInt(wordSpan.dataset.w, 10);
            if (!Number.isInteger(wordFlatIdx)) return;

            clearWordGesture();
            wordGesture = {
                wordFlatIdx,
                startX: event.clientX,
                startY: event.clientY,
                downAt: performance.now(),
                moved: false,
                longPressFired: false,
                timer: setTimeout(() => {
                    if (wordGesture && !wordGesture.moved) wordGesture.longPressFired = true;
                }, LONG_PRESS_MS)
            };
            try {
                if (typeof wordSpan.setPointerCapture === 'function') wordSpan.setPointerCapture(event.pointerId);
            } catch (e) { /* older browsers */ }
        });

        lyricsOutput.addEventListener('pointermove', (event) => {
            if (!wordGesture) return;
            const dx = event.clientX - wordGesture.startX;
            const dy = event.clientY - wordGesture.startY;
            if (dx * dx + dy * dy > MOVE_CANCEL_PX * MOVE_CANCEL_PX) {
                wordGesture.moved = true;
                if (wordGesture.timer) {
                    clearTimeout(wordGesture.timer);
                    wordGesture.timer = null;
                }
            }
        });

        lyricsOutput.addEventListener('pointerup', (event) => {
            if (!wordGesture) return;
            const gesture = wordGesture;
            clearWordGesture();
            const kind = classifyPointerGesture(gesture.moved, performance.now() - gesture.downAt, gesture.longPressFired);
            if (kind === 'longpress') {
                openEditorDialog(gesture.wordFlatIdx);
            } else if (kind === 'tap') {
                jumpToWord(gesture.wordFlatIdx);
            }
        });

        lyricsOutput.addEventListener('pointercancel', clearWordGesture);

        // Right-click opens the editor dialog too (desktop convenience).
        lyricsOutput.addEventListener('contextmenu', (event) => {
            const wordSpan = event.target.closest('.word');
            if (!wordSpan) return;
            event.preventDefault();
            const wordFlatIdx = parseInt(wordSpan.dataset.w, 10);
            if (wordGesture && !wordGesture.moved) {
                // Mobile long-press also fires contextmenu: mark the gesture so the
                // upcoming pointerup does not double-handle it.
                wordGesture.longPressFired = true;
                if (wordGesture.timer) {
                    clearTimeout(wordGesture.timer);
                    wordGesture.timer = null;
                }
            }
            openEditorDialog(wordFlatIdx);
        });

        function clearWordGesture() {
            if (!wordGesture) return;
            if (wordGesture.timer) clearTimeout(wordGesture.timer);
            wordGesture = null;
        }

        globalRepeatPlusBtn.addEventListener('click', () => {
            if (!isPlayerReady() || !songDoc) return;
            setRepeat('global', 0, 1);
        });

        globalRepeatMinusBtn.addEventListener('click', () => {
            if (!isPlayerReady() || !songDoc) return;
            setRepeat('global', 0, -1);
        });

        prevParaBtn.addEventListener('click', () => {
            if (prevParaBtn.disabled || currentSegFlatIndex < 0) return;
            const curPara = flatSegments[currentSegFlatIndex].paraIdx;
            seekToParagraph(Math.max(0, curPara - 1));
        });

        nextParaBtn.addEventListener('click', () => {
            if (nextParaBtn.disabled || currentSegFlatIndex < 0) return;
            const curPara = flatSegments[currentSegFlatIndex].paraIdx;
            const paraCount = songDoc ? songDoc.paragraphs.length : 0;
            seekToParagraph(Math.min(paraCount - 1, curPara + 1));
        });

        // --- editor dialog wiring ---
        editWordInput.addEventListener('input', applyWordFieldsFromDialog);
        editTranslationInput.addEventListener('input', applyWordFieldsFromDialog);
        editMarkedCheckbox.addEventListener('change', applyWordFieldsFromDialog);
        editImageInput.addEventListener('input', applyWordFieldsFromDialog);

        edSegRepeatPlusBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t) return;
            setRepeat('seg', t.fw.segFlat, 1);
            updateEditorRepeatControls();
        });
        edSegRepeatMinusBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t) return;
            setRepeat('seg', t.fw.segFlat, -1);
            updateEditorRepeatControls();
        });
        edSegSplitBtn.addEventListener('click', () => {
            if (!edSegSplitBtn.disabled && dialogWordFlatIndex >= 0) splitSentenceAt(dialogWordFlatIndex);
        });
        edSegMergeBtn.addEventListener('click', () => {
            if (!edSegMergeBtn.disabled && dialogWordFlatIndex >= 0) mergeSentenceWithNext(dialogWordFlatIndex);
        });
        edParaRepeatPlusBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t) return;
            setRepeat('para', t.fs.paraIdx, 1);
            updateEditorRepeatControls();
        });
        edParaRepeatMinusBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t) return;
            setRepeat('para', t.fs.paraIdx, -1);
            updateEditorRepeatControls();
        });
        edParaSplitBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t || edParaSplitBtn.disabled) return;
            splitParagraphAt(t.fw.segFlat, t.fw.word);
        });
        edParaMergeBtn.addEventListener('click', () => {
            const t = dialogTargets();
            if (!t || edParaMergeBtn.disabled) return;
            mergeParagraphWithNext(t.fs.paraIdx, t.fw.word);
        });

        editCancelBtn.addEventListener('click', closeEditorDialog);
        editorOverlay.addEventListener('click', (event) => {
            if (event.target === editorOverlay) closeEditorDialog();
        });
        editorOverlay.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeEditorDialog();
        });

        document.addEventListener('keydown', handleKeyboardShortcuts);

        function handleKeyboardShortcuts(event) {
            if (editorOverlay.classList.contains('show')) return;

            const activeElement = document.activeElement;

            const isTextInputFocused = (activeElement.tagName === 'INPUT' && /text|search|password|email|number|tel|url/.test(activeElement.type)) ||
                                      activeElement.tagName === 'TEXTAREA' || activeElement.isContentEditable;

            if (isTextInputFocused) return;

            const playerReady = isPlayerReady();
            const isRangeInputFocused = activeElement.tagName === 'INPUT' && activeElement.type === 'range';

            if (playerReady) {
                if (volumePopup.classList.contains('show')) {
                    if (event.code === 'ArrowUp' || event.code === 'ArrowDown') {
                        event.preventDefault();
                        const currentValue = parseFloat(volumeSlider.value);
                        const step = parseFloat(volumeSlider.step) || 0.01;
                        const maxVal = parseFloat(volumeSlider.max);
                        const minVal = parseFloat(volumeSlider.min);
                        let newValue = event.code === 'ArrowUp' ? currentValue + step : currentValue - step;
                        newValue = Math.max(minVal, Math.min(maxVal, newValue));
                        const precision = (String(step).split('.')[1] || '').length;
                        newValue = parseFloat(newValue.toFixed(precision || 2));
                        setVolume(newValue);
                        volumeSlider.value = newValue;
                        resetPopupTimer(volumePopup);
                        return;
                    }
                }

                if (speedPopup.classList.contains('show')) {
                    if (event.code === 'ArrowUp' || event.code === 'ArrowDown') {
                        event.preventDefault();
                        const currentValue = parseFloat(speedSlider.value);
                        const step = parseFloat(speedSlider.step) || 0.01;
                        const maxVal = parseFloat(speedSlider.max);
                        const minVal = parseFloat(speedSlider.min);
                        let newValue = event.code === 'ArrowUp' ? currentValue + step : currentValue - step;
                        newValue = Math.max(minVal, Math.min(maxVal, newValue));
                        const precision = (String(step).split('.')[1] || '').length;
                        newValue = parseFloat(newValue.toFixed(precision || 2));
                        setPlaybackSpeed(newValue);
                        speedSlider.value = newValue;
                        resetPopupTimer(speedPopup);
                        return;
                    }
                }
                if (bassBoostPopup.classList.contains('show')) {
                    if (event.code === 'ArrowUp' || event.code === 'ArrowDown') {
                        event.preventDefault();
                        const currentValue = parseFloat(bassBoostSlider.value);
                        const step = parseFloat(bassBoostSlider.step) || 1;
                        const maxVal = parseFloat(bassBoostSlider.max);
                        const minVal = parseFloat(bassBoostSlider.min);
                        let newValue = event.code === 'ArrowUp' ? currentValue + step : currentValue - step;
                        newValue = Math.max(minVal, Math.min(maxVal, newValue));
                        setBassBoost(newValue);
                        bassBoostSlider.value = newValue;
                        resetPopupTimer(bassBoostPopup);
                        return;
                    }
                }
                 if (underwaterPopup.classList.contains('show')) {
                    if (event.code === 'ArrowUp' || event.code === 'ArrowDown') {
                        event.preventDefault();
                        const currentValue = parseFloat(underwaterSlider.value);
                        const step = parseFloat(underwaterSlider.step) || 1;
                        const maxVal = parseFloat(underwaterSlider.max);
                        const minVal = parseFloat(underwaterSlider.min);
                        let newValue = event.code === 'ArrowUp' ? currentValue + step : currentValue - step;
                        newValue = Math.max(minVal, Math.min(maxVal, newValue));
                        setUnderwaterEffect(newValue);
                        underwaterSlider.value = newValue;
                        resetPopupTimer(underwaterPopup);
                        return;
                    }
                }
                 if (muffledPopup.classList.contains('show')) {
                    if (event.code === 'ArrowUp' || event.code === 'ArrowDown') {
                        event.preventDefault();
                        const currentValue = parseFloat(muffledSlider.value);
                        const step = parseFloat(muffledSlider.step) || 1;
                        const maxVal = parseFloat(muffledSlider.max);
                        const minVal = parseFloat(muffledSlider.min);
                        let newValue = event.code === 'ArrowUp' ? currentValue + step : currentValue - step;
                        newValue = Math.max(minVal, Math.min(maxVal, newValue));
                        setMuffledEffect(newValue);
                        muffledSlider.value = newValue;
                        resetPopupTimer(muffledPopup);
                        return;
                    }
                }
            }

            let currentBufferTime = getCurrentBufferTime();

            switch (event.code) {
                case 'Space':
                case 'KeyK':
                    if (playerReady && (activeElement.tagName !== 'BUTTON' || isRangeInputFocused)) {
                        event.preventDefault();
                        togglePlayback();
                    } else if (playerReady && activeElement.tagName === 'BUTTON' && !isRangeInputFocused) {
                         event.preventDefault();
                         togglePlayback();
                    }
                    break;

                case 'KeyJ':
                    if (playerReady) {
                        event.preventDefault();
                        const newTime = Math.max(0, currentBufferTime - 10);
                        seekAudio(newTime);
                    }
                    break;

                case 'KeyL':
                    if (playerReady) {
                        event.preventDefault();
                        const newTime = Math.min(audioBuffer.duration, currentBufferTime + 10);
                        seekAudio(newTime);
                    }
                    break;

                case 'ArrowLeft':
                    if (!isRangeInputFocused && playerReady) {
                        event.preventDefault();
                        const newTime = Math.max(0, currentBufferTime - 5);
                        seekAudio(newTime);
                    }
                    break;

                case 'ArrowRight':
                    if (!isRangeInputFocused && playerReady) {
                        event.preventDefault();
                        const newTime = Math.min(audioBuffer.duration, currentBufferTime + 5);
                        seekAudio(newTime);
                    }
                    break;

                case 'ArrowUp':
                    if (!isRangeInputFocused && playerReady) {
                        event.preventDefault();
                        let currentVolume = parseFloat(volumeSlider.value);
                        let newVolume = Math.min(1, parseFloat((currentVolume + 0.05).toFixed(2)));
                        setVolume(newVolume);
                        if (volumePopup.classList.contains('show')) {
                            resetPopupTimer(volumePopup);
                        }
                    }
                    break;
                case 'ArrowDown':
                    if (!isRangeInputFocused && playerReady) {
                        event.preventDefault();
                        let currentVolume = parseFloat(volumeSlider.value);
                        let newVolume = Math.max(0, parseFloat((currentVolume - 0.05).toFixed(2)));
                        setVolume(newVolume);
                        if (volumePopup.classList.contains('show')) {
                            resetPopupTimer(volumePopup);
                        }
                    }
                    break;
                case 'KeyM':
                    if (playerReady) {
                        event.preventDefault();
                        toggleMute();
                    }
                    break;
            }
        }
    </script>
