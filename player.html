<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Lyrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/realaurora-stw/song-player/refs/heads/main/icons/notes.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
  color-scheme: dark;
}
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            color: #f0f0f0;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

#lyrics-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px 5% 200px 5%;
            font-size: 2.8em;
            line-height: 1.6;
            display: flex;
            scroll-behavior: smooth;
            min-height: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

       #lyrics-container::-webkit-scrollbar {
            display: none;
        }

        #lyrics-output {
            max-width: 900px;
            width: 100%;
            text-align: left;
        }


        .paragraph {
            margin-bottom: 1.2em;
        }

        .paragraph-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.5em;
            color: #5a5a5a;
            cursor: pointer;
            margin-bottom: 0.15em;
            user-select: none;
            border-radius: 6px;
            padding: 2px 6px;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        .paragraph-header:hover {
            color: #9a9a9a;
        }
        .paragraph-header.active {
            color: #00bcd4;
        }
        .paragraph-header .para-label {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .segment {
            color: #555;
            transition: color 0.3s ease;
        }
        .segment.past {
            color: #8a8a8a;
        }
        .segment.active {
            color: #f0f0f0;
            background-color:darkslateblue;
        }

        .word {
            display: inline-block;
            margin: 0 0.08em;
            cursor: pointer;
            transition: color 0.25s ease-in-out, transform 0.2s ease-out, opacity 0.25s ease;
            will-change: transform;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .word:hover {
            opacity: 0.75;
        }
        .word.highlighted {
            color: #50d060;
            font-weight: 600;
            transform: translateY(-1px) scale(1.05);
        }
        .word.marked,
        .word.marked.highlighted {
            color: #e5484d;
        }
        .word-trans {
            font-size: 0.5em;
            color: #c9a227;
            margin-left: 0.3em;
            font-weight: normal;
            vertical-align: baseline;
            user-select: none;
            cursor: default;
        }

        #lyrics-output.placeholder {
             display: block;
             opacity: 1;
             transform: none;
             color: #555;
             font-style: italic;
             text-align: center;
             margin: auto;
             font-weight: normal;
        }


        #controls-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000000;
            padding: 15px 30px;
            border-top: 1px solid #0c0c0c;
            z-index: 10;
            color: #aaa;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .file-inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .file-inputs label {
            font-size: 0.9em;
        }


        .file-inputs input[type="file"] {
            font-size: 0.8em;
            max-width: 250px;
            color: #767676;
            font-family: inherit;
        }
        .file-inputs input[type="file"]::file-selector-button {
            padding: 5px 10px;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            background-color: #111;
            color: #ccc;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 10px;
            transition: background-color 0.2s, border-color 0.2s;
            font-family: inherit;
        }
        .file-inputs input[type="file"]::file-selector-button:hover {
            background-color: #252525;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        #playPauseBtn {
            background-color: #040404;
            color: #767676;
            border: none;
            padding: 8px 15px;
            font-size: 1em;
            border-radius: 12px;
            cursor: pointer;
            min-width: 80px;
            transition: background-color 0.2s, color 0.2s;
            font-family: inherit;
        }
        #playPauseBtn:hover:enabled {
             background-color: #1f1f1f;
        }

        #playPauseBtn:disabled {
            background-color: #141414;
            color: #666;
            cursor: not-allowed;
        }

        #progressBar {
            flex-grow: 1;
            max-width: 500px;
            cursor: pointer;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #0d0d0d;
            border-radius: 5px;
            outline: none;
            transition: background-color 0.2s;
        }

        #progressBar::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          width: 16px;
          height: 16px;
          background: #2a2a2a;
          border-radius: 50%;
          cursor: pointer;
          transition: background-color 0.2s, transform 0.15s ease-out;
        }
         #progressBar:hover::-webkit-slider-thumb {
              background: #2e2e2e;
         }
         #progressBar:active::-webkit-slider-thumb {
             transform: scale(1.1);
         }


        #progressBar::-moz-range-thumb {
          width: 16px;
          height: 16px;
          background: #757575;
          border-radius: 50%;
          cursor: pointer;
          border: none;
          transition: background-color 0.2s, transform 0.15s ease-out;
        }
         #progressBar:hover::-moz-range-thumb {
              background: #888;
         }
         #progressBar:active::-moz-range-thumb {
             transform: scale(1.1);
         }


        #progressBar:disabled::-webkit-slider-thumb {
            background: #333;
            cursor: not-allowed;
            transition: none;
             transform: none;
        }
        #progressBar:disabled::-moz-range-thumb {
            background: #333;
            cursor: not-allowed;
             transition: none;
             transform: none;
        }
        #progressBar:disabled {
            cursor: not-allowed;
             background: #0a0a0a;
        }


        #currentTime, #totalDuration {
            font-size: 0.9em;
            min-width: 45px;
            text-align: center;
            color: #4c4c4c;
            font-family: inherit;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        #audioPlayer {
             display: none;
        }

        #loadStatus {
             font-size: 0.8em;
             color: #4c4c4c;
             margin-left: 15px;
             min-height: 1.2em;
             font-family: inherit;
             transition: color 0.3s ease;
        }


       .control-icon-btn {
            background: none;
            border: none;
            color: #4c4c4c;
            font-size: 1.2em;
            padding: 5px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
            font-family: inherit;
       }
       .control-icon-btn:hover:enabled {
           color: #646464;
       }
       .control-icon-btn:disabled {
           cursor: not-allowed;
       }


        .volume-control-wrapper,
        .speed-control-wrapper,
        .bass-control-wrapper,
        .underwater-control-wrapper,
        .muffled-control-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .popup-control {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #080808;
            padding: 15px 15px 15px 15px;
            border-radius: 12px;
            box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.5);
            z-index: 20;
            width: 50px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s ease-out, transform 0.25s ease-out, visibility 0s 0.25s, background-color 0.3s ease, box-shadow 0.3s ease;
            will-change: opacity, transform, visibility;
        }

        .slider-wrapper-vertical {
            width: 90px;
            height: 24px;
            transform: rotate(-90deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .slider-vertical {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 8px;
            cursor: pointer;
            background: #171717;
            border-radius: 10px;
            outline: none;
            display: block;
            margin: 0;
            margin-right: 56px;
            transition: background-color 0.2s;
        }

        .slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; background: #ccc;
            border-radius: 50%; cursor: pointer; border: none;
            transition: background-color 0.2s;
        }
        .slider-vertical::-moz-range-thumb {
            width: 16px; height: 16px; background: #ccc;
            border-radius: 50%; cursor: pointer; border: none;
            transition: background-color 0.2s;
        }


        .slider-vertical:disabled { cursor: not-allowed; background: #444; }
        .slider-vertical:disabled::-webkit-slider-thumb { background: #666; cursor: not-allowed; }
        .slider-vertical:disabled::-moz-range-thumb { background: #666; cursor: not-allowed; }

        .popup-text-display {
            color: #f0f0f0;
            font-size: 0.8em;
            text-align: center;
            width: 100%;
            margin-top: auto;
            font-family: inherit;
            transition: color 0.3s ease;
        }


        .popup-control.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            transition: opacity 0.25s ease-out, transform 0.25s ease-out, visibility 0s 0s, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes editorIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .global-repeat-control {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #5a5a5a;
            font-size: 0.9em;
            user-select: none;
        }
        .global-repeat-control button {
            background: none;
            border: 1px solid #1c1c1c;
            color: #5a5a5a;
            border-radius: 6px;
            width: 1.7em;
            height: 1.7em;
            cursor: pointer;
            font-size: 0.95em;
            line-height: 1;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .global-repeat-control button:hover:enabled { color: #ccc; border-color: #333; }
        .global-repeat-control button:disabled { opacity: 0.35; cursor: not-allowed; }
        #globalRepeatValue { min-width: 1.6em; text-align: center; }

        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .editor-overlay.show { display: flex; }
        .editor-modal {
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
            padding: 24px 28px;
            width: min(420px, 90vw);
            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: editorIn 0.2s ease-out;
        }
        .editor-modal h3 { margin: 0; font-size: 1.1em; color: #f0f0f0; font-weight: 600; }
        .editor-modal .field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85em; color: #9a9a9a; }
        .editor-modal input[type="text"] {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 8px;
            color: #f0f0f0;
            padding: 9px 11px;
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .editor-modal input[type="text"]:focus { border-color: #00bcd4; }
        .editor-modal .marked-row { display: flex; align-items: center; gap: 8px; font-size: 0.85em; color: #9a9a9a; cursor: pointer; }
        .editor-modal .marked-row input { cursor: pointer; }
        .editor-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
        .editor-actions button { padding: 9px 18px; border-radius: 10px; border: none; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease; }
        #editCancelBtn { background-color: #1c1c1c; color: #bbb; }
        #editCancelBtn:hover { background-color: #262626; }

        .ed-zone { border: 1px solid #1f1f1f; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
        .ed-zone-title { font-size: 0.68em; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6a6a6a; }
        .ed-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.85em; color: #9a9a9a; }
        .ed-repeat { display: inline-flex; align-items: center; gap: 2px; }
        .ed-repeat-btn { background: #161616; border: 1px solid #262626; color: #bbb; border-radius: 6px; width: 2em; height: 2em; line-height: 1; cursor: pointer; font-size: 0.95em; padding: 0; transition: background-color 0.15s ease, color 0.15s ease; }
        .ed-repeat-btn:hover:enabled { background: #262626; color: #fff; }
        .ed-repeat-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .ed-repeat-val { min-width: 1.8em; text-align: center; color: #e0e0e0; }
        .ed-action-btn { background: #161616; border: 1px solid #262626; color: #bbb; border-radius: 8px; padding: 7px 10px; font-size: 0.8em; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
        .ed-action-btn:hover:enabled { background: #262626; color: #fff; }
        .ed-action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        body.light-mode .global-repeat-control { color: #777; }
        body.light-mode .global-repeat-control button { border-color: #ccc; color: #777; }
        body.light-mode .global-repeat-control button:hover:enabled { color: #111; border-color: #999; }
        body.light-mode .editor-overlay { background: rgba(255, 255, 255, 0.55); }
        body.light-mode .editor-modal { background: #fff; border-color: #ddd; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); }
        body.light-mode .editor-modal h3 { color: #1a1a1a; }
        body.light-mode .editor-modal .field,
        body.light-mode .editor-modal .marked-row { color: #666; }
        body.light-mode .editor-modal input[type="text"] { background: #f2f2f2; border-color: #ddd; color: #1a1a1a; }
        body.light-mode #editCancelBtn { background-color: #e8e8e8; color: #444; }
        body.light-mode #editCancelBtn:hover { background-color: #ddd; }



        @media (max-width: 768px) {
             #lyrics-container {
                 font-size: 2em;
                 padding: 20px 5% 150px 5%;
             }
             .player-controls { gap: 10px; }
             #playPauseBtn { padding: 6px 10px; font-size: 0.9em; }
            #currentTime, #totalDuration { font-size: 0.8em; min-width: 40px; }
            .file-inputs label { font-size: 0.8em; }
           .control-icon-btn { font-size: 1.1em; }


           .popup-control {
               padding: 12px 10px 12px 10px;
               height: 140px;
           }
           .slider-wrapper-vertical {
               width: 75px;
               height: 22px;
               margin-bottom: 15px;
           }
           .slider-vertical {
               width: 75px;
               height: 6px;
           }
            .slider-vertical::-webkit-slider-thumb { width: 14px; height: 14px; }
            .slider-vertical::-moz-range-thumb { width: 14px; height: 14px; }
           .popup-text-display { font-size: 0.75em; }
        }

        body.light-mode {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        body.light-mode #lyrics-output.placeholder {
            color: #888;
        }

        body.light-mode .paragraph-header { color: #8a8a8a; }
        body.light-mode .paragraph-header:hover { color: #444; }
        body.light-mode .paragraph-header.active { color: #008ba3; }
        body.light-mode .segment { color: #999; }
        body.light-mode .segment.past { color: #666; }
        body.light-mode .segment.active { color: #1a1a1a; background-color: lemonchiffon;}
        body.light-mode .word.highlighted { color: #0a7d2c; }
        body.light-mode .word.marked,
        body.light-mode .word.marked.highlighted { color: #d32029; }
        body.light-mode .word-trans { color: #8a6d00; }
        body.light-mode .ed-zone { border-color: #e2e2e2; }
        body.light-mode .ed-zone-title { color: #999; }
        body.light-mode .ed-row { color: #666; }
        body.light-mode .ed-repeat-btn,
        body.light-mode .ed-action-btn { background: #eee; border-color: #d8d8d8; color: #444; }
        body.light-mode .ed-repeat-btn:hover:enabled,
        body.light-mode .ed-action-btn:hover:enabled { background: #ddd; color: #111; }
        body.light-mode .ed-repeat-val { color: #1a1a1a; }

        body.light-mode #controls-container {
            background-color: #ffffff;
            border-top: 1px solid #dddddd;
            color: #555;
        }

        body.light-mode .file-inputs input[type="file"] {
            color: #555;
        }

        body.light-mode .file-inputs input[type="file"]::file-selector-button {
            border: 1px solid #ccc;
            background-color: #eee;
            color: #333;
        }
        body.light-mode .file-inputs input[type="file"]::file-selector-button:hover {
            background-color: #ddd;
        }

        body.light-mode #playPauseBtn {
            background-color: #e0e0e0;
            color: #222;
        }
        body.light-mode #playPauseBtn:hover:enabled {
             background-color: #d0d0d0;
        }
        body.light-mode #playPauseBtn:disabled {
            background-color: #f0f0f0;
            color: #aaa;
        }

        body.light-mode #progressBar {
            background: #dddddd;
        }

        body.light-mode #progressBar::-webkit-slider-thumb {
          background: #aaaaaa;
        }
         body.light-mode #progressBar:hover::-webkit-slider-thumb {
              background: #888888;
         }

        body.light-mode #progressBar::-moz-range-thumb {
          background: #aaaaaa;
        }
         body.light-mode #progressBar:hover::-moz-range-thumb {
              background: #888888;
         }

        body.light-mode #progressBar:disabled::-webkit-slider-thumb {
            background: #cccccc;
        }
        body.light-mode #progressBar:disabled::-moz-range-thumb {
            background: #cccccc;
        }
        body.light-mode #progressBar:disabled {
             background: #eeeeee;
        }

        body.light-mode #currentTime,
        body.light-mode #totalDuration {
            color: #555;
        }

        body.light-mode #loadStatus {
             color: #777;
        }

       body.light-mode .control-icon-btn {
            color: #444;
       }
       body.light-mode .control-icon-btn:hover:enabled {
           color: #000;
       }
       body.light-mode .control-icon-btn:disabled {
           color: #bbbbbb;
       }

        body.light-mode .popup-control {
            background-color: #f8f8f8;
            box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .slider-vertical {
            background: #cccccc;
        }

        body.light-mode .slider-vertical::-webkit-slider-thumb {
            background: #666666;
        }
        body.light-mode .slider-vertical::-moz-range-thumb {
            background: #666666;
        }

        body.light-mode .slider-vertical:disabled { background: #dddddd; }
        body.light-mode .slider-vertical:disabled::-webkit-slider-thumb { background: #aaaaaa; }
        body.light-mode .slider-vertical:disabled::-moz-range-thumb { background: #aaaaaa; }

        body.light-mode .popup-text-display {
            color: #333333;
        }

    </style>
</head>
<body>

    <div id="lyrics-container">
        <div id="lyrics-output" class="placeholder">Load a .songlyrics file.</div>
    </div>

    <div id="controls-container">
        <div class="file-inputs">

            <input type="file" id="songLyricsFile" accept=".mp3, .lyrics.json" title="Select .songlyrics, .json or .mp3 file">
             <span id="loadStatus"></span>
        </div>

        <audio id="audioPlayer" style="display: none;"></audio>
        <div class="player-controls">
            <button id="playPauseBtn" disabled>▶ Play</button>
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" value="0" step="0.01" disabled>
            <span id="totalDuration">0:00</span>

            <div class="global-repeat-control" title="Global sentence repeat (every sentence)">
                <button id="globalRepeatMinusBtn" class="control-icon-btn" disabled>−</button>
                <span id="globalRepeatValue">1</span>
                <button id="globalRepeatPlusBtn" class="control-icon-btn" disabled>+</button>
            </div>

            <button id="prevParaBtn" class="control-icon-btn" disabled title="Previous paragraph">
                <i class="fas fa-arrow-up"></i>
            </button>
            <button id="nextParaBtn" class="control-icon-btn" disabled title="Next paragraph">
                <i class="fas fa-arrow-down"></i>
            </button>


            <div class="volume-control-wrapper">
                <button id="volumeBtn" class="control-icon-btn" disabled title="Volume">
                    <i class="fas fa-volume-up"></i>
                </button>
                <div id="volumePopup" class="popup-control">
                    <div class="slider-wrapper-vertical">
                        <input type="range" id="volumeSlider" class="slider-vertical" min="0" max="1" step="0.01" value="1" disabled>
                    </div>
                    <span id="volumePercentage" class="popup-text-display">100%</span>
                </div>
            </div>

    <script>
        const songLyricsFileInput = document.getElementById('songLyricsFile');
        const lyricsOutput = document.getElementById('lyrics-output');

        const playPauseBtn = document.getElementById('playPauseBtn');

        const volumeBtn = document.getElementById('volumeBtn');
        const volumePopup = document.getElementById('volumePopup');

        const volumeIcon = volumeBtn.querySelector('i');
        const volumePercentage = document.getElementById('volumePercentage');
        const speedBtn = document.getElementById('speedBtn');
        const speedPopup = document.getElementById('speedPopup');
        const speedSlider = document.getElementById('speedSlider');
        const speedRateDisplay = document.getElementById('speedRateDisplay');
        const bassBoostBtn = document.getElementById('bassBoostBtn');
        const bassBoostPopup = document.getElementById('bassBoostPopup');
        const bassBoostSlider = document.getElementById('bassBoostSlider');
        const bassBoostLevelDisplay = document.getElementById('bassBoostLevelDisplay');
        const underwaterBtn = document.getElementById('underwaterBtn');
        const underwaterPopup = document.getElementById('underwaterPopup');
        const underwaterSlider = document.getElementById('underwaterSlider');
        const underwaterLevelDisplay = document.getElementById('underwaterLevelDisplay');
        const muffledBtn = document.getElementById('muffledBtn');
        const muffledPopup = document.getElementById('muffledPopup');
        const muffledSlider = document.getElementById('muffledSlider');
        const muffledLevelDisplay = document.getElementById('muffledLevelDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadIcon = downloadBtn.querySelector('.fa-download');
        const downloadSpinnerIcon = downloadBtn.querySelector('.fa-circle-notch');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const globalRepeatMinusBtn = document.getElementById('globalRepeatMinusBtn');
        const globalRepeatPlusBtn = document.getElementById('globalRepeatPlusBtn');
        const globalRepeatValue = document.getElementById('globalRepeatValue');
        const prevParaBtn = document.getElementById('prevParaBtn');
        const nextParaBtn = document.getElementById('nextParaBtn');
        const editorOverlay = document.getElementById('editorOverlay');
        const editWordInput = document.getElementById('editWordInput');
        const editTranslationInput = document.getElementById('editTranslationInput');
        const editMarkedCheckbox = document.getElementById('editMarkedCheckbox');
        const editImageInput = document.getElementById('editImageInput');
        const edSegRepeatMinusBtn = document.getElementById('edSegRepeatMinusBtn');
        const edSegRepeatVal = document.getElementById('edSegRepeatVal');
        const edSegRepeatPlusBtn = document.getElementById('edSegRepeatPlusBtn');
        const edSegSplitBtn = document.getElementById('edSegSplitBtn');
        const edSegMergeBtn = document.getElementById('edSegMergeBtn');
        const edParaRepeatMinusBtn = document.getElementById('edParaRepeatMinusBtn');
        const edParaRepeatVal = document.getElementById('edParaRepeatVal');
        const edParaRepeatPlusBtn = document.getElementById('edParaRepeatPlusBtn');
        const edParaSplitBtn = document.getElementById('edParaSplitBtn');
        const edParaMergeBtn = document.getElementById('edParaMergeBtn');
        const editCancelBtn = document.getElementById('editCancelBtn');


        let audioContext;
        let audioBuffer;
        let sourceNode;
        let gainNode;
        let bassFilterNode;
        let underwaterFilterNode;
        let muffledFilterNode;
        let isPlaying = false;
        let isPaused = false;
        let startTime = 0;
        let startOffset = 0;
        let currentPlaybackRate = 1.0;
        let animationFrameId = null;

        let songDoc = null;
        let flatSegments = [];
        let flatWords = [];
        let wordSpans = [];
        let wordTransSpans = [];
        let wordImgs = [];
        let segSpans = [];
        let paraSpans = [];
        let currentSegFlatIndex = -1;
        let currentWordFlatIndex = -1;
        let repeatPlaysLeft = 1;
        let originalAudioDataUrl = null;
        let originalAudioBytes = null;
        let originalAudioMime = null;

        let audioLoaded = false;
        let lyricsLoaded = false;
        let isSeeking = false;
        let currentSongFilename = null;
        let isMuted = false;
        let previousVolumeBeforeMute = 1.0;


        const VOLUME_STORAGE_KEY = 'playerVolumeSetting';
        const SPEED_STORAGE_KEY = 'playerSpeedSetting_v2';
        const BASS_BOOST_STORAGE_KEY = 'playerBassBoostSetting';
        const UNDERWATER_STORAGE_KEY = 'playerUnderwaterSetting';
        const MUFFLED_STORAGE_KEY = 'playerMuffledSetting';
        const THEME_STORAGE_KEY = 'playerTheme';
        const LIGHT_MODE_CLASS = 'light-mode';

        let volumePopupTimeout = null;
        let speedPopupTimeout = null;
        let bassBoostPopupTimeout = null;
        let underwaterPopupTimeout = null;
        let muffledPopupTimeout = null;
        const POPUP_CLOSE_DELAY = 6000;


        function isPlayerReady() {
            return audioLoaded && !!audioContext && !!audioBuffer;
        }
        function getCurrentBufferTime() {
             let time = startOffset;
             if (isPlayerReady() && isPlaying && audioContext && startTime > 0) {
                 const elapsedRealTime = audioContext.currentTime - startTime;
                 time = startOffset + (elapsedRealTime * currentPlaybackRate);
                 time = time % audioBuffer.duration;
             }
             return Math.max(0, Math.min(time, audioBuffer?.duration ?? 0));
        }


        function initializeAudioContext() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    bassFilterNode = audioContext.createBiquadFilter();
                    bassFilterNode.type = 'lowshelf';
                    bassFilterNode.frequency.value = 250;
                    bassFilterNode.gain.value = 0;

                    underwaterFilterNode = audioContext.createBiquadFilter();
                    underwaterFilterNode.type = 'lowpass';
                    underwaterFilterNode.frequency.value = 22050;
                    underwaterFilterNode.Q.value = 1;

                    muffledFilterNode = audioContext.createBiquadFilter();
                    muffledFilterNode.type = 'lowpass';
                    muffledFilterNode.frequency.value = 22050;
                    muffledFilterNode.Q.value = 1; 

                    gainNode = audioContext.createGain();
                    
                    bassFilterNode.connect(underwaterFilterNode);
                    underwaterFilterNode.connect(muffledFilterNode);
                    muffledFilterNode.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    loadVolumeSetting();
                    loadSpeedSetting();
                    loadBassBoostSetting();
                    loadUnderwaterSetting();
                    loadMuffledSetting();

                } catch (e) {
                    console.error("Web Audio API is not supported in this browser.", e);
                    alert("Sorry, your browser doesn't support the required Web Audio API for this player.");
                    audioContext = null;
                }
            }
        }



        function loadSetting(key, defaultValue, validator) {
             try {
                const savedValue = localStorage.getItem(key);
                if (savedValue !== null) {
                    if (key === THEME_STORAGE_KEY) {
                        if (validator(savedValue)) return savedValue;
                    } else {
                        const parsedValue = parseFloat(savedValue);
                        if (validator(parsedValue)) return parsedValue;
                    }
                    localStorage.removeItem(key);
                }
            } catch (e) { console.error("Error loading setting:", key, e); }
            return defaultValue;
        }

        function saveSetting(key, value) {
             try {
                localStorage.setItem(key, value.toString());
             } catch (e) {
                console.error("Error saving setting:", key, value, e);
            }
        }

        function loadVolumeSetting() {
            const vol = loadSetting(VOLUME_STORAGE_KEY, 1, v => !isNaN(v) && v>=0 && v<=1);
            if(gainNode && audioContext) {
                gainNode.gain.value = vol;
            }
            if(volumeSlider) {
                 volumeSlider.value = vol;
                 if(volumePercentage) volumePercentage.textContent = `${Math.round(vol * 100)}%`;
                 updateVolumeIcon(vol);
            }
            isMuted = false;
            previousVolumeBeforeMute = vol;
        }

        function loadSpeedSetting() {
            const speed = loadSetting(SPEED_STORAGE_KEY, 1, s => !isNaN(s) && s>=0.01 && s<=2);
             setPlaybackSpeed(speed, false);
             updateTotalDurationDisplay();
        }

        function loadBassBoostSetting() {
            const bassLevel = loadSetting(BASS_BOOST_STORAGE_KEY, 0, b => !isNaN(b) && b >= 0 && b <= 30);
            setBassBoost(bassLevel);
        }

        function loadUnderwaterSetting() {
            const underwaterLevel = loadSetting(UNDERWATER_STORAGE_KEY, 0, u => !isNaN(u) && u >= 0 && u <= 100);
            setUnderwaterEffect(underwaterLevel);
        }

        function loadMuffledSetting() {
            const muffledLevel = loadSetting(MUFFLED_STORAGE_KEY, 0, m => !isNaN(m) && m >= 0 && m <= 100);
            setMuffledEffect(muffledLevel);
        }

        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add(LIGHT_MODE_CLASS);
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                themeToggleBtn.title = 'Dark Mode';
                saveSetting(THEME_STORAGE_KEY, 'light');
            } else {
                document.body.classList.remove(LIGHT_MODE_CLASS);
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                themeToggleBtn.title = 'Light Mode';
                saveSetting(THEME_STORAGE_KEY, 'dark');
            }
        }

        function loadTheme() {
            const savedTheme = loadSetting(THEME_STORAGE_KEY, 'dark', t => t === 'light' || t === 'dark');
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            const isLightMode = document.body.classList.contains(LIGHT_MODE_CLASS);
            applyTheme(isLightMode ? 'dark' : 'light');
        }



        function setVolume(newVolume) {
             const clampedVolume = Math.max(0, Math.min(1, newVolume));
             if (gainNode && audioContext) {
                gainNode.gain.setValueAtTime(clampedVolume, audioContext.currentTime);
             }
             if (volumeSlider) {
                 volumeSlider.value = clampedVolume;
                 updateVolumeIcon(clampedVolume);
                 volumePercentage.textContent = `${Math.round(clampedVolume * 100)}%`;

                 if (!isMuted) {
                    saveSetting(VOLUME_STORAGE_KEY, clampedVolume);
                 }
            }
        }


        // =========================================================================
        // START OF BUG FIX
        // =========================================================================
        function setPlaybackSpeed(rate, adjustPlayback = true) {
            if (isNaN(rate)) return;

            const minSpeed = parseFloat(speedSlider?.min ?? 0.18);
            const maxSpeed = parseFloat(speedSlider?.max ?? 2);
            const newRate = Math.max(minSpeed, Math.min(maxSpeed, rate));

            const previousRate = currentPlaybackRate;
            currentPlaybackRate = newRate;

            if (speedSlider) speedSlider.value = newRate;
            if (speedRateDisplay) speedRateDisplay.textContent = `${newRate.toFixed(2)}x`;
            saveSetting(SPEED_STORAGE_KEY, newRate);
            updateTotalDurationDisplay();

            if (adjustPlayback && audioContext && audioBuffer) {
                const isFirefox = navigator.userAgent.includes("Firefox");
                const wasPlaying = isPlaying;
                
                if (wasPlaying && isFirefox) {
                    // BUG FIX: The "rewind" issue was caused by calling getCurrentBufferTime()
                    // AFTER currentPlaybackRate was already updated. This caused a miscalculation.
                    // The fix is to manually calculate the current time here using the *previousRate*.
                    const elapsedRealTime = audioContext.currentTime - startTime;
                    const elapsedBufferTime = elapsedRealTime * previousRate;
                    const correctCurrentBufferTime = (startOffset + elapsedBufferTime) % audioBuffer.duration;
                    
                    // Now seek using the correctly calculated time.
                    seekAudio(correctCurrentBufferTime);

                } else if (wasPlaying && sourceNode?.playbackRate) {
                    // This is the standard path for non-Firefox browsers or when paused. It works correctly.
                    const elapsedRealTime = audioContext.currentTime - startTime;
                    const elapsedBufferTime = elapsedRealTime * previousRate;

                    startOffset = (startOffset + elapsedBufferTime) % audioBuffer.duration;
                    startOffset = Math.max(0, startOffset);

                    sourceNode.playbackRate.setValueAtTime(currentPlaybackRate, audioContext.currentTime);
                    startTime = audioContext.currentTime;
                }
                
                updateCurrentTimeDisplay(getCurrentBufferTime());
            }
        }
        // =========================================================================
        // END OF BUG FIX
        // =========================================================================


        function setBassBoost(levelInDb) {
            if (isNaN(levelInDb) || !bassFilterNode || !audioContext) return;

            const minBoost = parseFloat(bassBoostSlider?.min ?? 0);
            const maxBoost = parseFloat(bassBoostSlider?.max ?? 30);
            const newLevel = Math.max(minBoost, Math.min(maxBoost, levelInDb));

            bassFilterNode.gain.setValueAtTime(newLevel, audioContext.currentTime);
            
            if (bassBoostSlider) bassBoostSlider.value = newLevel;
            if (bassBoostLevelDisplay) {
                bassBoostLevelDisplay.textContent = `${newLevel > 0 ? '+' : ''}${Math.round(newLevel)} dB`;
            }
            saveSetting(BASS_BOOST_STORAGE_KEY, newLevel);
        }

        function setUnderwaterEffect(level) {
            if (isNaN(level) || !underwaterFilterNode || !audioContext) return;
            
            const minLevel = parseFloat(underwaterSlider?.min ?? 0);
            const maxLevel = parseFloat(underwaterSlider?.max ?? 100);
            const newLevel = Math.max(minLevel, Math.min(maxLevel, level));

            const normalizedValue = newLevel / maxLevel;

            const minFreq = 400;
            const maxFreq = 22050;
            const logMin = Math.log(minFreq);
            const logMax = Math.log(maxFreq);
            const scale = logMax - logMin;
            const targetFreq = Math.exp(logMax - (normalizedValue * scale));
            
            const targetQ = 1 + (normalizedValue * 4);

            underwaterFilterNode.frequency.setValueAtTime(targetFreq, audioContext.currentTime);
            underwaterFilterNode.Q.setValueAtTime(targetQ, audioContext.currentTime);
            
            if (underwaterSlider) underwaterSlider.value = newLevel;
            if (underwaterLevelDisplay) underwaterLevelDisplay.textContent = `${Math.round(newLevel)}%`;
            saveSetting(UNDERWATER_STORAGE_KEY, newLevel);
        }

        function setMuffledEffect(level) {
            if (isNaN(level) || !muffledFilterNode || !audioContext) return;
            
            const minLevel = parseFloat(muffledSlider?.min ?? 0);
            const maxLevel = parseFloat(muffledSlider?.max ?? 100);
            const newLevel = Math.max(minLevel, Math.min(maxLevel, level));

            const normalizedValue = newLevel / maxLevel;

            const minFreq = 700;
            const maxFreq = 22050;
            const logMin = Math.log(minFreq);
            const logMax = Math.log(maxFreq);
            const scale = logMax - logMin;
            const targetFreq = Math.exp(logMax - (normalizedValue * scale));
            
            const targetQ = 1 + (normalizedValue * 1.5);

            muffledFilterNode.frequency.setValueAtTime(targetFreq, audioContext.currentTime);
            muffledFilterNode.Q.setValueAtTime(targetQ, audioContext.currentTime);
            
            if (muffledSlider) muffledSlider.value = newLevel;
            if (muffledLevelDisplay) muffledLevelDisplay.textContent = `${Math.round(newLevel)}%`;
            saveSetting(MUFFLED_STORAGE_KEY, newLevel);
        }

        function toggleMute() {
            if (!audioContext || !gainNode) return;

            if (isMuted) {
                isMuted = false;
                setVolume(previousVolumeBeforeMute);
            } else {
                isMuted = true;
                previousVolumeBeforeMute = gainNode.gain.value;
                setVolume(0);
            }
        }


        document.addEventListener('DOMContentLoaded', () => {
             loadTheme();
             resetPlayerAndLyrics(false);
             checkEnablePlayer();
            document.addEventListener('visibilitychange', function() {
                 if (document.visibilityState === 'visible') {
                     if (lyricsContainer) {
                         lyricsContainer.style.scrollBehavior = 'auto';
                         requestAnimationFrame(() => {
                             lyricsContainer.style.scrollBehavior = 'smooth';
                         });
                     }
                 }
             });
        });


        songLyricsFileInput.addEventListener('change', (event) => {
            const files = event.target.files;

            if (files.length === 0) {
                return;
            }
            const file = files[0];
            const fileNameLower = file.name.toLowerCase();

            currentSongFilename = file.name;
            resetPlayerAndLyrics(false);
            loadStatus.textContent = '';
            
            if (!fileNameLower.endsWith('.mp3') && !fileNameLower.endsWith('.lyrics.json')) {
                alert('Invalid file type. Please select a .songlyrics, .json or .mp3 file.');
                songLyricsFileInput.value = '';
                currentSongFilename = null;
                resetPlayerAndLyrics(false);
                checkEnablePlayer();
                return;
            }

            initializeAudioContext();
            if (!audioContext) {
                loadStatus.textContent = 'Error: Audio system not ready.';
                resetPlayerAndLyrics(true);
                checkEnablePlayer();
                return;
            }

            loadStatus.textContent = `Loading ${file.name}...`;
            const reader = new FileReader();

            reader.onload = (e) => {

                const arrayBuffer = e.target.result;
                if (isJsonContent(arrayBuffer)) {
                    parseJsonSongFile(arrayBuffer);
                } else {
                    handleMp3File(arrayBuffer);
                }
            };

            reader.onerror = () => {
                alert("Error reading the selected file.");
                loadStatus.textContent = 'Error reading file.';
                resetPlayerAndLyrics(true);
                checkEnablePlayer();
            };
            reader.readAsArrayBuffer(file);
        });

        volumeBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            if (!volumeBtn.disabled) {
                const wasVisible = volumePopup.classList.contains('show');
                togglePopup(volumePopup);
                hidePopup(speedPopup);
                hidePopup(bassBoostPopup);
                hidePopup(underwaterPopup);
                hidePopup(muffledPopup);
                if (!wasVisible && volumePopup.classList.contains('show')) {
                    resetPopupTimer(volumePopup);
                } else if (wasVisible && !volumePopup.classList.contains('show')) {
                    clearPopupTimer(volumePopup);
                }
            }
        });

        volumeSlider.addEventListener('input', () => {
            if (!volumeSlider.disabled) {
                const newVolume = parseFloat(volumeSlider.value);
                
                if (isMuted && newVolume > 0) {
                    isMuted = false;
                } else if (isMuted && newVolume === 0) {
                }
                
                setVolume(newVolume);
                resetPopupTimer(volumePopup);
            }
        });


        volumeSlider.addEventListener('wheel', (event) => {
            if (volumeSlider.disabled) return;
            event.preventDefault();
            event.stopPropagation();

            const delta = event.deltaY;
            const currentValue = parseFloat(volumeSlider.value);
            let step = 0.01;

            if (event.ctrlKey) step = 0.1;
            else if (event.shiftKey) step = 0.005;
            else if (Math.abs(delta) > 100) step = 0.05;
            else if (Math.abs(delta) > 50) step = 0.03;


            let newValue = delta < 0 ? currentValue + step : currentValue - step;
            newValue = Math.max(0, Math.min(1, newValue));
            
            const precision = (String(step).split('.')[1] || '').length || 2;
            newValue = parseFloat(newValue.toFixed(precision));

            setVolume(newValue);
            resetPopupTimer(volumePopup);
        });

        speedBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            if (!speedBtn.disabled) {
                const wasVisible = speedPopup.classList.contains('show');
                togglePopup(speedPopup);
                hidePopup(volumePopup);
                hidePopup(bassBoostPopup);
                hidePopup(underwaterPopup);
                hidePopup(muffledPopup);
                 if (!wasVisible && speedPopup.classList.contains('show')) {
                    resetPopupTimer(speedPopup);
                } else if (wasVisible && !speedPopup.classList.contains('show')) {
                    clearPopupTimer(speedPopup);
                }
            }
        });

        speedSlider.addEventListener('input', () => {
            if (!speedSlider.disabled) {
                const rate = parseFloat(speedSlider.value);
                setPlaybackSpeed(rate);
                resetPopupTimer(speedPopup);
            }
        });


        speedSlider.addEventListener('wheel', (event) => {
             if (speedSlider.disabled) return;
            event.preventDefault();
            event.stopPropagation();
            const delta = event.deltaY;
            const currentValue = parseFloat(speedSlider.value);
            const minSpeed = parseFloat(speedSlider.min);
            const maxSpeed = parseFloat(speedSlider.max);
            let step = 0.01;
            if (event.ctrlKey) step = 0.1;
            else if (event.shiftKey) step = 0.005;
            let newValue = delta < 0 ? currentValue + step : currentValue - step;
            newValue = Math.max(minSpeed, Math.min(maxSpeed, newValue));
            newValue = parseFloat(newValue.toFixed(2));
            setPlaybackSpeed(newValue);
            resetPopupTimer(speedPopup);
        });

        bassBoostBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            if (!bassBoostBtn.disabled) {
                const wasVisible = bassBoostPopup.classList.contains('show');

        function bytesToBase64(bytes) {
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function bytesToDataUrl(bytes, mime) {
            return `data:${mime};base64,${bytesToBase64(new Uint8Array(bytes))}`;
        }

        async function handleExport() {
            if (!isPlayerReady()) {
                alert("Please load a song first.");
                return;
            }

            downloadIcon.style.display = 'none';
            downloadSpinnerIcon.style.display = 'inline-block';
            downloadBtn.disabled = true;
            loadStatus.textContent = 'Exporting...';

            try {
                // Always embed the original audio. Re-rendering to WAV would explode the
                // file size (18MB mp3 -> 110MB wav) and break lyric timing when the
                // playback rate is not 1, since segment times stay in original coordinates.
                let audioDataUrl = null;
                if (originalAudioDataUrl) {
                    audioDataUrl = originalAudioDataUrl;
                } else if (originalAudioBytes) {
                    audioDataUrl = bytesToDataUrl(originalAudioBytes, originalAudioMime || 'audio/mpeg');
                }
                if (!audioDataUrl) {
                    throw new Error("No source audio available for export.");
                }

                // Serialize the in-memory doc: only fields the user actually set exist on it,
                // so this naturally writes incremental fields (repeat / translation / marked).
                const exportDoc = JSON.parse(JSON.stringify(songDoc || { meta: {}, paragraphs: [] }));
                if (!exportDoc.meta) exportDoc.meta = {};
                exportDoc.meta.title = exportDoc.meta.title || (currentSongFilename ? currentSongFilename.replace(/\.[^/.]+$/, "") : 'song');
                exportDoc.meta.version = '0.1';
                exportDoc.audio = audioDataUrl;

                const jsonString = JSON.stringify(exportDoc);
                let baseFilename = "song";
                if (currentSongFilename) {
                    baseFilename = currentSongFilename.replace(/\.[^/.]+$/, "");
                }
                const downloadFilename = `${baseFilename}.songlyrics`;

                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1500);

                loadStatus.textContent = 'Export ready!';
            } catch (error) {
                console.error("Error during export:", error);
                alert(`Failed to export: ${error.message}`);
                loadStatus.textContent = `Export error: ${error.message}`;
            } finally {
                downloadIcon.style.display = 'inline-block';
                downloadSpinnerIcon.style.display = 'none';
                downloadBtn.disabled = !isPlayerReady();
            }
        }
